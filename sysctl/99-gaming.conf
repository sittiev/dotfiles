# Perfil gaming: Ryzen 5 7520U + 610M, 7 GB RAM + zram (CachyOS).
# Foco: menos stall de reclaim/swap (micro-stutter) e 1%/0.1% low estáveis.
# Base: ArchWiki (zram: swappiness 180 / boost 0 / scale 125 / page-cluster 0),
# thread "stutter in game? swap configuration" do fórum CachyOS e relatos do
# r/linux_gaming (swappiness baixo resolve "sluggishness progressiva").
#
# ATIVAR (uma vez, com senha):
#   sudo cp 99-gaming.conf /etc/sysctl.d/99-gaming.conf
#   sudo cp /usr/lib/udev/rules.d/30-zram.rules /etc/udev/rules.d/99-zram.rules
#   # editar 99-zram.rules: SYSCTL{vm.swappiness}="150" -> "20"
#   sudo sysctl --system
# O override do udev é obrigatório: sem ele a regra do CachyOS volta o
# swappiness para 150 a cada boot quando /dev/zram0 existe.
# DESFAZER: sudo rm /etc/sysctl.d/99-gaming.conf /etc/udev/rules.d/99-zram.rules
#
# THP de propósito intocado: `always` + `defrag=defer+madvise` (padrão CachyOS)
# é o melhor para jogos/Wine (menos TLB miss); o defer evita stall de compactação.
# `vm.dirty_bytes` segue 256M do CachyOS; só o background sobe 64M -> 128M para
# espaçar o writeback. `max_map_count` alto é exigência de alguns jogos.

# 20 = meio-termo para 7 GB: evita swapar à toa (caso do stutter), mas mantém
# o zram como rede de segurança. Faixa útil: 1–30. Com browser fechado antes
# de jogar, o game-mode.sh ainda tenta `swapoff -a` por cima disso.
vm.swappiness = 20

# Swap-in de 1 página por falta (padrão 3 adianta readahead inútil em jogo).
vm.page-cluster = 0

# kswapd acorda mais cedo e mantém mais memória livre: menos direct-reclaim
# (o freeze de 100ms+) no meio do frame. `boost=0` desliga spikes de reclaim.
vm.watermark_scale_factor = 125
vm.watermark_boost_factor = 0

# Mantém page-cache/dentry (shader do jogo no disco é caro de reler).
vm.vfs_cache_pressure = 50

vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 134217728

# Sem compactação proativa: evita kworker varrendo RAM durante o jogo.
vm.compaction_proactiveness = 0

vm.max_map_count = 2147483642
fs.inotify.max_user_instances = 1024
