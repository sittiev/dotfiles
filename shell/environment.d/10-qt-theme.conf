# Tema dos apps Qt (Qt5 Widgets, Qt6 Widgets e Qt Quick/QML).
# Sem QT_QPA_PLATFORMTHEME o Qt ignora o qt5ct/qt6ct e usa a paleta padrão
# dele (#efefef / #308cc6), independente do que render.sh escreve em
# ~/.config/qt{5,6}ct/colors/dotfiles.conf.
# qt6ct: lxqt-policykit-agent e Qt6 (ldd confirma Qt6Widgets). Com qt5ct o Qt6
# nao achava o plugin (só existe libqt6ct.so no dir do Qt6) e caia no Fusion
# claro — o agente do polkit nunca seguia o tema. Qt5 sem libqt6ct.so cai no
# gtk3 (libqgtk3.so existe nos dois dirs), aceitavel: o agente e Qt6.
QT_QPA_PLATFORMTHEME=qt6ct
