# yambar (sway) — generated by render.sh (light). Do not edit.
bar:
  height: 18
  location: bottom
  background: 00000000
  foreground: 3A3936ff
  font: "FindersKeepers:size=20"
  font-shaping: none
  spacing: 4
  right:
    - script:
        path: ~/.config/sway/scripts/yambar-clock.sh
        poll-interval: 1000
        content:
          string:
            text: "{display}"
            font: "FindersKeepers:size=20"
            on-click: ~/.config/sway/scripts/yambar-clock-toggle.sh
            deco: {background: {color: E8E7E3ff}}
