# yambar (sway) — generated by render.sh (light). Do not edit.
bar:
  height: 18
  location: bottom
  background: 00000000
  foreground: 373734ff
  font: "Atkinson Hyperlegible Mono:size=12"
  font-shaping: none
  spacing: 4
  left:
    - script:
        path: ~/.config/sway/scripts/yambar-dirs.sh
        poll-interval: 3600000
        content:
          string:
            text: "{display}"
            font: "Atkinson Hyperlegible Mono:size=12"
            on-click: ~/.config/sway/scripts/yambar-dirs-toggle.sh
            deco: {background: {color: F7F7F7ff}}
  right:
    - script:
        path: ~/.config/sway/scripts/yambar-tasks.sh
        poll-interval: 2000
        content:
          string:
            text: " {display}"
            font: "Atkinson Hyperlegible Mono:size=12"
            on-click: ~/.config/sway/scripts/yambar-tasks-toggle.sh
            deco: {background: {color: F7F7F7ff}}
    - script:
        path: ~/.config/sway/scripts/yambar-clock.sh
        poll-interval: 1000
        content:
          string:
            text: "{display}"
            font: "Atkinson Hyperlegible Mono:size=12"
            on-click: ~/.config/sway/scripts/yambar-clock-toggle.sh
            deco: {background: {color: F7F7F7ff}}
