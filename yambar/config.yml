# yambar (sway) — generated by render.sh (dark). Do not edit.
bar:
  height: 18
  location: bottom
  background: 00000000
  foreground: C0BFBAff
  font: "JetBrainsMono Nerd Font:size=12"
  font-shaping: none
  spacing: 4
  left:
    - script:
        path: ~/.config/sway/scripts/yambar-dirs.sh
        poll-interval: 3600000
        content:
          string:
            text: "{display}"
            font: "JetBrainsMono Nerd Font:size=12"
            on-click: ~/.config/sway/scripts/yambar-dirs-toggle.sh
            deco: {background: {color: 141414ff}}
  right:
    - script:
        path: ~/.config/sway/scripts/yambar-tasks.sh
        poll-interval: 2000
        content:
          string:
            text: " {display}"
            font: "JetBrainsMono Nerd Font:size=12"
            on-click: ~/.config/sway/scripts/yambar-tasks-toggle.sh
            deco: {background: {color: 141414ff}}
    - script:
        path: ~/.config/sway/scripts/yambar-clock.sh
        poll-interval: 1000
        content:
          string:
            text: "{display}"
            font: "JetBrainsMono Nerd Font:size=12"
            on-click: ~/.config/sway/scripts/yambar-clock-toggle.sh
            deco: {background: {color: 141414ff}}
