# yambar (sway) — generated by render.sh (dark). Do not edit.
bar:
  height: 18
  location: top
  right-margin: 8
  background: 00000000
  foreground: E6E6E6ff
  font: "monospace:size=10"
  font-shaping: none
  spacing: 4
  right:
    - clock:
        time-format: "%a %d %b, %H:%M"
        content:
          string:
            text: "{time}"
            font: "monospace:size=10"
            deco: {background: {color: 15274Cff}}
