# minimal status: session/window numbers + names, full title, clock, no brackets/quotes
set -g status-left "#{session_name}"
set -g status-left-length 32
set -g status-right "#{pane_title} %H:%M %d-%b-%y"
set -g window-status-format "#I:#W"
set -g window-status-current-format "#I:#W"
set -g window-status-separator " "
set -g automatic-rename on

# persistence: autosave every 5 min, restore on server start
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'b0o/tmux-autoreload'
set -g @plugin 'timvw/tmux-assistant-resurrect'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @resurrect-capture-pane-contents 'on'
run '~/.tmux/plugins/tpm/tpm'
